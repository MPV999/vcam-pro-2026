name: Android Build

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test and verify APK
    runs-on: ubuntu-latest
    env:
      # The `secrets` context is not allowed inside a step-level `if:`, so the
      # secret is mapped to an environment variable once and the steps test that.
      VCAM_KEYSTORE_B64: ${{ secrets.VCAM_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "${ANDROID_HOME}" ]; then
            export ANDROID_HOME=/usr/local/lib/android/sdk
          fi
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"
          SDKMANAGER=$(ls "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1 || true)
          if [ -n "${SDKMANAGER}" ]; then
            yes | "${SDKMANAGER}" --licenses >/dev/null 2>&1 || true
            "${SDKMANAGER}" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          fi
          echo "platforms:"
          ls "${ANDROID_HOME}/platforms" || true
          echo "build-tools:"
          ls "${ANDROID_HOME}/build-tools" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore release keystore
        if: env.VCAM_KEYSTORE_B64 != ''
        working-directory: android
        run: |
          set -euo pipefail
          mkdir -p keystore
          printf '%s' "$VCAM_KEYSTORE_B64" | base64 --decode > keystore/release.jks
          {
            echo "storePassword=${{ secrets.VCAM_KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.VCAM_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.VCAM_KEY_PASSWORD }}"
          } > keystore/keystore.properties
          echo "Release keystore restored"

      - name: Unit tests
        working-directory: android
        env:
          VCAM_VERSION_CODE: ${{ github.run_number }}
          VCAM_VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle :vcamsdk:testDebugUnitTest :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble release APK
        working-directory: android
        env:
          VCAM_VERSION_CODE: ${{ github.run_number }}
          VCAM_VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Validate and checksum APK
        working-directory: android
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          if [ -z "$APK" ]; then echo "No APK produced"; exit 1; fi
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          echo "::group::aapt2 badging"
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | head -n 30
          echo "::endgroup::"
          echo "::group::apksigner verify"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          echo "::endgroup::"
          VERSION="1.0.${{ github.run_number }}"
          OUT="$RUNNER_TEMP/vcampro-ultimate-${VERSION}.apk"
          cp "$APK" "$OUT"
          ( cd "$RUNNER_TEMP" && sha256sum "$(basename "$OUT")" > SHA256SUMS.txt )
          cat "$RUNNER_TEMP/SHA256SUMS.txt"
          {
            echo "RELEASE_APK=$OUT"
            echo "RELEASE_VERSION=$VERSION"
            echo "RELEASE_APK_NAME=$(basename "$OUT")"
            echo "RELEASE_APK_SIZE=$(stat -c%s "$OUT")"
            echo "RELEASE_SHA256=$(sha256sum "$OUT" | cut -d' ' -f1)"
          } >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vcampro-apk
          path: |
            ${{ env.RELEASE_APK }}
            ${{ runner.temp }}/SHA256SUMS.txt
          retention-days: 30

      - name: Build summary
        run: |
          {
            echo "### VCAM PRO build"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Version | ${{ env.RELEASE_VERSION }} |"
            echo "| APK | ${{ env.RELEASE_APK_NAME }} |"
            echo "| Size | ${{ env.RELEASE_APK_SIZE }} bytes |"
            echo "| SHA-256 | \`${{ env.RELEASE_SHA256 }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
